[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "catchment-health-dashboard"
version = "0.1.0"
description = "Reproducible contracts and processing foundation for the Catchment Health Dashboard"
requires-python = ">=3.12"
license = { file = "LICENSE" }
dependencies = []

[project.optional-dependencies]
lint = ["ruff>=0.8,<1"]

[tool.setuptools.packages.find]
include = ["catchment_dashboard*"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.ruff.lint.per-file-ignores]
"tools/*.py" = ["E402"]
